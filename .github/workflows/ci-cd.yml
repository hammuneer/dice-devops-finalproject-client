name: CI/CD - client

# CI : build the image on a GitHub-hosted runner, run it against the published
#      server image (end-to-end checksum test), push it to Docker Hub.
# CD : on the client VM (self-hosted runner) update the image tag in docker-compose.yml,
#      pull the new image and redeploy. Monitoring config is synced as well.
# Notify: post the result to Slack.

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "terraform/**"
  workflow_dispatch:

concurrency:
  group: deploy-client
  cancel-in-progress: false

env:
  IMAGE: hammuneer/dice-devops-finalproject-client
  SERVER_IMAGE: hammuneer/dice-devops-finalproject-server:latest
  DEPLOY_DIR: /opt/dice-client

jobs:
  build:
    name: Build, test and push image
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute image tag
        id: meta
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Check Python syntax
        run: python3 -m py_compile app/*.py

      - uses: docker/setup-buildx-action@v3

      - name: Build image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: ${{ env.IMAGE }}:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: End-to-end test against the server image
        run: |
          docker network create e2e
          docker run -d --name server --network e2e "$SERVER_IMAGE"
          docker run --name client-test --network e2e \
            -e SERVER_HOST=server -e SERVER_PORT=5000 -e FETCH_INTERVAL_SECONDS=0 \
            "$IMAGE:test"
          docker logs client-test | grep -q "Checksum VERIFIED"
          echo "End-to-end test passed"
          docker rm -f server client-test && docker network rm e2e

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: hammuneer
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push image (commit tag + latest)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha

  deploy:
    name: Deploy to client VM
    needs: build
    runs-on: [self-hosted, client-vm]
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Update image tag in docker-compose.yml
        run: |
          mkdir -p "$DEPLOY_DIR"
          [ -f "$DEPLOY_DIR/docker-compose.yml" ] && cp "$DEPLOY_DIR/docker-compose.yml" "$DEPLOY_DIR/docker-compose.yml.prev"
          sed -E "s#^([[:space:]]*image:[[:space:]]*${IMAGE}):.*#\1:${TAG}#" docker-compose.yml > "$DEPLOY_DIR/docker-compose.yml"
          echo "Deploying:"; grep -n "image:" "$DEPLOY_DIR/docker-compose.yml"

      - name: Point the client at the server VM
        run: |
          # The server's private IP is stored in the VM metadata by Terraform.
          SERVER_IP=$(curl -fsS -H "Metadata-Flavor: Google" \
            http://metadata.google.internal/computeMetadata/v1/instance/attributes/server-internal-ip)
          printf "SERVER_HOST=%s\nSERVER_PORT=5000\nFETCH_INTERVAL_SECONDS=60\n" "$SERVER_IP" > "$DEPLOY_DIR/.env"
          cat "$DEPLOY_DIR/.env"

      - name: Pull new image and deploy
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          docker compose pull
          docker compose up -d --no-build --remove-orphans

      - name: Verify deployment (file received and checksum verified)
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          for i in $(seq 1 20); do
            if docker logs file-client 2>&1 | grep -q "Checksum VERIFIED"; then
              docker logs --tail 3 file-client; exit 0
            fi
            sleep 3
          done
          docker logs --tail 50 file-client
          exit 1

      - name: Roll back on failure
        if: failure()
        working-directory: ${{ env.DEPLOY_DIR }}
        run: |
          if [ -f docker-compose.yml.prev ]; then
            mv docker-compose.yml.prev docker-compose.yml
            docker compose up -d --no-build
            echo "Rolled back to: $(grep image: docker-compose.yml)"
          fi

      - name: Sync monitoring stack
        run: |
          cp -R monitoring/. /opt/monitoring/
          cd /opt/monitoring && docker compose up -d --remove-orphans

      - name: Remove old images
        run: docker image prune -af

  notify:
    name: Slack notification
    needs: [build, deploy]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Post result to Slack
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          BUILD: ${{ needs.build.result }}
          DEPLOY: ${{ needs.deploy.result }}
          TAG: ${{ needs.build.outputs.tag }}
          COMMIT_MSG: ${{ github.event.head_commit.message || format('Manual run on {0}', github.ref_name) }}
        run: |
          if [ -z "$SLACK_WEBHOOK_URL" ]; then
            echo "SLACK_WEBHOOK_URL secret not set - skipping notification"; exit 0
          fi
          if [ "$BUILD" = success ] && [ "$DEPLOY" = success ]; then
            icon=":white_check_mark:"; text="Deployment succeeded"
          else
            icon=":x:"; text="Deployment FAILED"
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          msg="$icon *$text* - \`${GITHUB_REPOSITORY#*/}\`
          *Image:* \`$IMAGE:${TAG:-n/a}\`
          *Target:* client-vm   *Build:* $BUILD   *Deploy:* $DEPLOY
          *Commit:* ${COMMIT_MSG%%$'\n'*} (by $GITHUB_ACTOR)
          <$run_url|View pipeline run>"
          jq -n --arg text "$(echo "$msg" | sed 's/^ *//')" '{text: $text}' \
            | curl -fsS -X POST -H 'Content-Type: application/json' --data @- "$SLACK_WEBHOOK_URL"
