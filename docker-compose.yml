services:
  client:
    # The CD pipeline rewrites this tag to the commit SHA on every deploy.
    image: hammuneer/dice-devops-finalproject-client:latest
    build: .
    container_name: file-client
    restart: unless-stopped
    environment:
      # On GCP this is the server VM's internal IP (set in .env).
      # Locally it defaults to the Docker host, where the server publishes port 5000.
      SERVER_HOST: ${SERVER_HOST:-host.docker.internal}
      SERVER_PORT: ${SERVER_PORT:-5000}
      DATA_DIR: /clientdata
      FETCH_INTERVAL_SECONDS: ${FETCH_INTERVAL_SECONDS:-60}
    extra_hosts:
      # Makes host.docker.internal resolve on Linux too (Docker Desktop already provides it).
      - "host.docker.internal:host-gateway"
    volumes:
      - clientvol:/clientdata

volumes:
  clientvol:
    name: clientvol
